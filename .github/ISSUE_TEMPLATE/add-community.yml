name: 🏘️ Ajouter une communauté
description: Proposer l'ajout d'une nouvelle communauté tech toulousaine au site
title: "[Community] "
labels: ["🧑‍💻 communauté"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de vouloir ajouter votre communauté au Toulouse Tech Hub ! 
        
        Remplissez les informations ci-dessous pour nous aider à créer votre page automatiquement.

  - type: input
    id: community-name
    attributes:
      label: Nom de la communauté
      description: Le nom complet de votre communauté
      placeholder: ex. Python Toulouse
    validations:
      required: true

  - type: input
    id: community-slug
    attributes:
      label: Identifiant court (slug)
      description: |
        Un identifiant court en minuscules, sans espaces ni accents (utilisé pour les URLs et fichiers).
        Si votre communauté existe déjà sur Meetup, utilisez le même slug que sur Meetup pour une synchronisation facile.
      placeholder: ex. python, js-and-co, devops-cloud
    validations:
      required: true

  - type: input
    id: community-url
    attributes:
      label: Site web principal
      description: |
        URL du site officiel de la communauté (peut être une page Meetup.com).
        Copilot détectera automatiquement s'il s'agit d'une page Meetup pour synchroniser les événements.
      placeholder: ex. https://www.meetup.com/python-toulouse/ ou https://toulousegamedev.fr/
    validations:
      required: true

  - type: input
    id: events-feed-url
    attributes:
      label: Flux RSS ou Atom des événements (optionnel)
      description: |
        Si votre communauté annonce ses événements dans un flux RSS ou Atom, indiquez son URL.
        Privilégiez un flux dédié aux événements plutôt qu'un flux général d'actualités.
        La date de la rencontre doit figurer dans le flux ou la page liée, pas seulement la date de publication.
      placeholder: ex. https://votre-communaute.fr/evenements/feed/

  - type: input
    id: registration-url
    attributes:
      label: Site d'inscription aux événements (optionnel)
      description: |
        Si différent du site principal, indiquez où les utilisateurs peuvent s'inscrire aux événements.
        Laissez vide si c'est le même que le site principal.
      placeholder: ex. https://www.eventbrite.com/o/votre-orga ou https://forms.gle/...

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Une description courte de votre communauté (2-3 phrases)
      placeholder: |
        Nous organisons des rencontres mensuelles autour de...
        
        Notre communauté rassemble...
    validations:
      required: true

  - type: input
    id: logo-url
    attributes:
      label: Logo (optionnel)
      description: URL d'un logo/image représentant votre communauté (JPG, PNG, WebP ou AVIF - sera converti en JPG)
      placeholder: https://example.com/logo.png

  - type: textarea
    id: social-links
    attributes:
      label: Liens sociaux (optionnel)
      description: |
        Listez vos réseaux sociaux (un par ligne)
        Format: `type: url` où type peut être: website, twitter, linkedin, github, youtube, discord, slack
      placeholder: |
        twitter: https://x.com/votre-compte
        linkedin: https://www.linkedin.com/company/votre-page
        github: https://github.com/votre-org
      render: text

  - type: checkboxes
    id: terms
    attributes:
      label: Conditions
      description: En soumettant cette issue, vous confirmez que
      options:
        - label: Ma communauté est basée à Toulouse ou dans sa région
          required: true
        - label: Ma communauté est orientée tech/numérique
          required: true
        - label: J'autorise l'ajout des informations fournies sur toulouse-tech-hub.fr
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        
        ### 🤖 Automatisation
        
        Une fois cette issue créée, GitHub Copilot pourra générer automatiquement :
        - Le fichier `_groups/{slug}.md` avec vos informations
        - L'ajout dans `.github/workflows/update.cs` si vous utilisez Meetup ou un flux RSS/Atom compatible
        - La mise à jour des templates d'issue et du worflow pour l'ajout manuel d'évènements
        - La mise à jour du README.md
        - Une pull request prête à être mergée
        
        **Prochaines étapes :**
        1. Validez cette issue
        2. Un mainteneur ou Copilot créera une PR
        3. Nous vérifierons et mergerons la PR
        4. Votre communauté apparaîtra sur le site ! 🎉
